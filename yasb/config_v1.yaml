# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true

bars:
  primary-bar:
    enabled: true
    screens:
      - '*'
    class_name: "yasb-bar"
    alignment:
      position: "top"
      align: "center"
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      round_corners: true
      round_corners_type: "normal"
      border_color: None
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: true
    dimensions:
      width: "100%"
      height: 28
    padding:
      top: 4
      left: 6
      bottom: 0
      right: 6
    widgets:
      left:
        - "glazewm_tiling_direction"
        - "glazewm_workspaces"
        - "active_window"
      center:
        - "clock"
      right:
        - "cava"
        - "media"
        - "taskbar"
        - "memory"
        - "systray"
        - "github"
        - "wifi"
        - "volume"
        - "wallpapers"
        - "control_center"

widgets:
  # Clock
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}<span>{alarm}</span>"
      label_alt: "{%a, %d %b %H:%M}"
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: "center"
        direction: "down"
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "toggle_label"
        on_right: "context_menu"

  # Media
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}"
      label_alt: "{title}{s}{artist}"
      separator: " - "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      max_field_size:
        label: 20
        label_alt: 30
      show_thumbnail: true
      controls_only: false
      controls_left: false
      controls_hide: false
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      icons:
        prev_track: ""
        next_track: ""
        play: "\ue768"
        pause: ""
      media_menu:
        blur: false                  # Whether to apply a blur effect to the popup background.
        round_corners: true          # Whether to round the corners of the popup.
        round_corners_type: "normal" # "normal" or "small" (Win11 only)
        border_color: "system"       # The border color of the popup. Can be a HEX, None or "system".
        alignment: "right"           # The alignment of the popup relative to the widget. Can be "left", "center", or "right".
        direction: "down"            # The direction in which the popup opens. Can be "up" or "down".
        offset_top: 6                # The vertical offset of the popup from the widget.
        offset_left: 0               # The horizontal offset of the popup from the widget.
        thumbnail_corner_radius: 8   # The corner radius for the thumbnail in the popup.
        thumbnail_size: 120          # The size of the thumbnail in the popup.
        max_title_size: 60           # The maximum size for the title in the popup.
        max_artist_size: 20          # The maximum size for the artist name in the popup.
        max_source_size: 16          # The maximum size for the source app name in the popup.
        show_source: false            # Whether to show the media source app name in the popup (resolved from OS/app metadata).
        show_volume_slider: true    # Whether to show the volume slider in the popup. Volume control per application.
      media_menu_icons:
        play: "\ue768"        # Icon for the play button in the popup.
        pause: "\ue769"       # Icon for the pause button in the popup.
        prev_track: "\ue892"  # Icon for the previous track button in the popup.
        next_track: "\ue893"  # Icon for the next track button in the popup.
        mute: "\ue994"        # Icon for the mute button in the popup.
        unmute: "\ue74f"      # Icon for the unmute button in the popup.
      scrolling_label:
        enabled: false          # Whether to enable the scrolling label.
        update_interval_ms: 33  # The update interval for the scrolling label in milliseconds.
        style: "left"           # The style of the scrolling label. Can be "left", "right", "bounce", or "bounce-ease".
        separator: " | "        # The separator between repeating text in "left" or "right" scrolling style.
        label_padding: 1        # The padding around the label in "bounce" and "bounce-ease" style. By default it's one character on each side.
        ease_slope: 20          # The easing slope for the bounce effect. Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
        ease_pos: 0.8           # The easing curve position for the bounce effect.
        ease_min: 0.5           # The minimum value for the bounce effect easing curve.
      progress_bar:
        enabled: true       # Whether to enable the progress bar on the widget.
        alignment: "bottom"  # The alignment of the progress bar inside the widget container. Can be "top", "bottom", or "center".

  # Active Window
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}' hwnd={win[hwnd]}]"
      label_no_window: ""
      label_icon: true
      label_icon_size: 16
      max_length: 56
      max_length_ellipsis: "..."
      monitor_exclusive: true
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  # GlazeWM
  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\udb81\udce1"
      vertical_label: "\udb81\udce2"

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"
      hide_if_offline: false
      monitor_exclusive: true
      enable_scroll_switching: true
      app_icons:
        enabled_populated: false
        enabled_active: false
        size: 0
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false

  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 16
      tooltip: true
      show_only_visible: false
      strict_filtering: true
      monitor_exclusive: false
      animation:
        enabled: true
        duration: 200
      preview:
        enabled: false
        width: 240
        delay: 400
        padding: 8
        margin: 8
        blur: false
        peek: false
      grouping:
        enabled: false
        show_count: true
      title_label:
        enabled: false
        show: "always"
        min_length: 10
        max_length: 30
      ignore_apps:
        processes: []
        titles: []
        classes: []

  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>󰣇</span>"
      tooltip: true
      sections_order:
        - "system_controls"
        - "quick_actions"
        - "sliders"
        - "power"
        - "media"
      popup:
        alignment: "center"
        direction: "down"
        border_color: "None"
        round_corners: true
        round_corners_type: "normal"
        offset_top: 8
      sections:
        system_controls:
          profile_image_size: 28
          power_icon: "\uE7E8"
          lock_icon: "\uE72E"
          settings_icon: "\uE713"
        quick_actions:
          show: true
          columns: 3
          label_position: "default"
          actions:
            - id: "toggle_dnd"
              label: "Do Not Disturb"
              icon: "\uf285"
            - id: "toggle_mute"
              label: "Mute"
              icon: "\ue74f"
            - id: "toggle_mic_mute"
              label: "Mic Mute"
              icon: "\uF12E"
            - id: "screenshot"
              label: "Screenshot"
              icon: "\ue91b"
            - id: "touch_keyboard"
              label: "Keyboard"
              icon: "\uE765"
            - id: "toggle_theme"
              label: "Dark Mode"
              icon: "\uE708"
        sliders:
          show: true
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\ue622"
            next_track: "\ue623"
            play: "\uf5b0"
            pause: "\ue62e"
        power:
          show: true
          power_plan_title: "Power Plan"
          power_mode_title: "Power Mode"
          button_menu_icon: "\ue76c"
      callbacks:
        on_left: "toggle_menu"

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: ""
      label_expanded: ""
      label_position: "right"
      icon_size: 16
      pin_click_modifier: "alt"
      show_in_popup: true
      icons_per_row: 4
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "None"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "{wifi_name} {wifi_strength}%"
      update_interval: 5000
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec cmd.exe /c start ms-settings:network"
        on_right: "toggle_label"
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span>{ip_addr}"
      ethernet_icon: "\ueba9"
      get_exact_wifi_strength: false
      wifi_icons:
        - "󰤭"
        - "󰤟"
        - "󰤢"
        - "󰤥"
        - "󰤨"
      menu_config:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "None"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        wifi_icons_secured:
          - "󰤡"
          - "󰤤"
          - "󰤧"
          - "󰤪"
        wifi_icons_unsecured:
          - "󰤠"
          - "󰤣"
          - "󰤦"
          - "󰤩"

  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\ue7aa</span>"
      image_path: 
        - "D:\\Art\\Ref\\Wallpaper"
      change_automatically: false # Automatically change wallpaper
      update_interval: 60 # If change_automatically is true, update interval in seconds
      engine:
        enabled: true
        animation: "circle" # circle/slide_top/diamond/split
      gallery:
        type: "default" # default/magnified/strip/slide - see "Gallery types" below
        image_width: 220
        orientation: "portrait" # landscape/portrait
        image_corner_radius: 0
        accent_color: "auto" # the Windows accent, or a hex such as "#89b4fa", currently used for images border
      keybindings:
        - keys: "ctrl+alt+w"
          action: "toggle_gallery"
          screen: "cursor" # active/cursor/primary
      # Note: do not use run_after: command if you don't know what it does
      run_after: # List of commands to run after wallpaper is changed
        - "wal -s -t -e -q -n -i {image}" # {image} is replaced with the new wallpaper path
        - "cmd.exe /c start /min pwsh ./yasb.ps1"
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      icons:
        "muted": "" # Icon for muted
        "10": "\uf027"  # Icon for 0-10% volume
        "30": "\uf027"  # Icon for 11-30% volume
        "60": "\uf027"  # Icon for 31-60% volume
        "100": "\uf027" # Icon for 61-100% volume
      audio_menu:
        blur: true # Enable blur effect for the menu
        round_corners: true # Enable round corners for the menu (not supported on Windows 10)
        round_corners_type: "normal" # Set the type of round corners for the menu (normal, small) (not supported on Windows 10)
        border_color: "None" # Set the border color for the menu, "system", Hex color or None
        alignment: "right" # Set the alignment of the menu (left, right, center)
        direction: "down" # Set the direction of the menu (up, down)
        offset_top: 6 # Set the top offset of the menu
        offset_left: 0 # Set the left offset of the menu
        show_apps: true # Whether to show the list of applications with audio sessions
        show_app_labels: false # Whether to show application labels in the audio menu
        show_app_icons: true # Whether to show application icons in the audio menu
        show_apps_expanded: false # Whether application volumes are expanded by default when opening the menu
        app_icons: # Icons for the toggle button to expand/collapse application volumes
          toggle_down: "\uf078" # Icon for btn collapsed state
          toggle_up: "\uf077" # Icon for btn expanded state
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"

  github:
    type: "yasb.github.GithubWidget"
    options:
      label: "<span></span>"
      label_alt: "Notifications {data}" # {data} return number of unread notification
      token: "" # GitHub Personal access tokens (classic) https://github.com/settings/tokens
      max_notification: 30 # Max number of notification displaying in menu max: 50
      notification_dot:
        enabled: True
        corner: "bottom_left" # Can be "top_left", "top_right", "bottom_left", "bottom_right"
        color: "red" # Can be hex color or string
        margin: [ 1, 1 ] # x and y margin for the dot
      only_unread: false # Show only unread or all notifications; 
      show_comment_count: false # Summarize comment totals for issues, PRs, and discussions
      reason_filters: [] # e.g. ['mention', 'assign'] to limit notifications by reason
      max_field_size: 54 # Max characters in title before truncation.
      update_interval: 300 # Check for new notification in seconds
      menu:
        blur: True # Enable blur effect for the menu
        round_corners: True # Enable round corners for the menu (this option is not supported on Windows 10)
        round_corners_type: "normal" # Set the type of round corners for the menu (normal, small) (this option is not supported on Windows 10)
        border_color: "None" # Set the border color for the menu (this option is not supported on Windows 10)
        alignment: "right"
        direction: "down"
        show_categories: false
        categories_order: ["PullRequest", "Issue", "CheckSuite", "Release", "Discussion"]

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "{virtual_mem_free}"
      label_alt: "<span></span> {virtual_mem_free}"
      update_interval: 6000
      callbacks:
        on_left: "do_nothing"
        on_right: "toggle_label"

  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12
      min_bar_height: 0
      gradient: 1
      foreground: "#ffffff"
      gradient_color_1: '#ffffff'
      gradient_color_2: '#ffffff'
      gradient_color_3: '#ffffff'
      bars_number: 16
      bar_spacing: 2
      bar_width: 4
      bar_type: "bars"
      framerate: 60
      hide_empty: true



